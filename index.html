  .who-label { font-size: 13px; color: #555; }

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBR_2hJsWxVPysMR5WM52viie0nLw81w14",
  authDomain: "task-tracker-43ec2.firebaseapp.com",
  databaseURL: "https://task-tracker-43ec2-default-rtdb.firebaseio.com",
  projectId: "task-tracker-43ec2",
  storageBucket: "task-tracker-43ec2.firebasestorage.app",
  messagingSenderId: "960268998510",
  appId: "1:960268998510:web:87802ede5d057994c0937f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ALLOWED_DOMAIN = "growgrounds.org";

let projects = {};
let tasks = {};
let subtasks = {};
let currentUser = null;
let expandedProjects = new Set();
let expandedTasks = new Set();
let expandedSubtasks = new Set();
let expandedPriorityItems = new Set();
let collapsedGroups = new Set();
let editMenuOpen = null;
let dragState = null;
let groupDragState = null;
let personPriorityOrder = [];
let pendingQuillInits = [];
let addForm = null;
let userPrefs = {};
let nameDisplay = {};
let lastSelectSig = "";

document.getElementById("login-btn").addEventListener("click", () => {
  const provider = new firebase.auth.OAuthProvider("microsoft.com");
  provider.setCustomParameters({ tenant: ALLOWED_DOMAIN });
  auth.signInWithPopup(provider).catch(err => {
    document.getElementById("error-banner").textContent = "Sign-in failed: " + err.message;
  });
});
document.getElementById("signout-btn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(user => {
  const errorBanner = document.getElementById("error-banner");
  if (user) {
    if (!user.email.endsWith("@" + ALLOWED_DOMAIN)) {
      errorBanner.textContent = "Access restricted to @" + ALLOWED_DOMAIN + " accounts.";
      auth.signOut();
      return;
    }
    currentUser = user;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-email").textContent = user.email;
    errorBanner.textContent = "";
    startListeners();
  } else {
    currentUser = null;
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

function startListeners() {
  db.ref("state/projects").on("value", snap => { projects = snap.val() || {}; ensureGeneralProject(); render(); });
  db.ref("state/tasks").on("value", snap => { tasks = snap.val() || {}; render(); });
  db.ref("state/subtasks").on("value", snap => { subtasks = snap.val() || {}; render(); });
  db.ref("state/personPriorityOrder").on("value", snap => { personPriorityOrder = snap.val() || []; render(); });
  if (currentUser && currentUser.uid) db.ref("state/userPrefs/" + currentUser.uid).on("value", snap => { userPrefs = snap.val() || {}; render(); });
}

function ensureGeneralProject() {
  const existing = Object.entries(projects).find(([id, p]) => p.isOthers);
  if (!existing) {
    db.ref("state/projects").push().set({ name: "General Tasks", isOthers: true, order: -1, createdAt: Date.now() });
  } else if (existing[1].name !== "General Tasks") {
    db.ref("state/projects/" + existing[0] + "/name").set("General Tasks");
  }
}

// ---------- Field defaults and helpers ----------
function defaultTaskFields() {
  return { responsibleMode: "single", responsible: "", responsibles: [], url: "", deadline: "", ownDeadlineOn: false, waiting: false, dateDone: "", notes: "", done: false, hasSubtasks: false };
}
function defaultSubtaskFields() {
  return { responsible: "", deadline: "", waiting: false, dateDone: "", notes: "", done: false };
}
function itemResponsibleMode(item) { return item.responsibleMode || "single"; }
function itemResponsibles(item) { return item.responsibles || []; }
function allResponsiblesDone(item) {
  const list = itemResponsibles(item);
  if (list.length === 0) return true;
  return list.every(r => r.done);
}
function byOrder(a, b) { return (a[1].order || 0) - (b[1].order || 0); }
function hasRealNotes(html) {
  return !!html && html.replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim() !== "";
}
function isCheckboxEnabled(kind, id, item) {
  let enabled = true;
  if (kind === "task" && item.hasSubtasks) {
    const subs = subtasksOfTask(id);
    if (subs.length > 0) enabled = subs.every(([sid, s]) => s.done);
  }
  if (itemResponsibleMode(item) === "multiple") enabled = enabled && allResponsiblesDone(item);
  return enabled;
}
function deadlineStatus(item) {
  if (item.done) return "done";
  if (item.waiting) return "waiting";
  if (!item.deadline) return "keep";
  const today = new Date(); today.setHours(0,0,0,0);
  const deadline = new Date(item.deadline + "T00:00:00");
  const diffDays = Math.round((deadline - today) / 86400000);
  if (diffDays < 0) return "overdue";
  if (diffDays <= 7) return "urgent";
  if (diffDays <= 30) return "important";
  return "keep";
}
const STATUS_LABEL = { overdue: "Overdue", urgent: "Urgent", waiting: "Waiting", important: "Important", keep: "Keep in mind", done: "Done" };
const STATUS_RANK = { overdue: 0, urgent: 1, waiting: 2, important: 3, keep: 4, done: 5 };
function badgeHtml(status) { return `<span class="badge badge-${status}">${STATUS_LABEL[status]}</span>`; }
function worseStatus(a, b) { return STATUS_RANK[b] < STATUS_RANK[a] ? b : a; }
function responsibleSummary(item) {
  if (itemResponsibleMode(item) === "multiple") {
    const list = itemResponsibles(item);
    if (list.length === 0) return "";
    return list.map(r => r.name).filter(Boolean).join(", ");
  }
  return item.responsible || "";
}
function formatDMY(isoDate) {
  if (!isoDate) return "";
  const [y, m, d] = isoDate.split("-");
  return d + "-" + m + "-" + y;
}
function subtasksOfTask(taskId) {
  return Object.entries(subtasks).filter(([id, s]) => s.taskId === taskId).sort(byOrder);
}
function tasksOfProject(projectId) {
  return Object.entries(tasks).filter(([id, t]) => t.projectId === projectId).sort(byOrder);
}
function nextSubtaskDeadline(taskId) {
  let best = null;
  subtasksOfTask(taskId).forEach(([id, s]) => {
    if (!s.done && s.deadline && (!best || s.deadline < best.date)) best = { date: s.deadline, name: s.name };
  });
  return best;
}
function nextDeadlineText(taskId) {
  const subs = subtasksOfTask(taskId);
  if (subs.length === 0) return "No subtasks yet";
  if (subs.every(([sid, s]) => s.done)) return "All subtasks done";
  const next = nextSubtaskDeadline(taskId);
  if (next) return formatDMY(next.date) + " \u00b7 " + next.name;
  return "No subtask deadlines set yet";
}
function computeEffectiveTaskStatus(taskId, task) {
  if (task.done) return "done";
  if (!task.hasSubtasks) return deadlineStatus(task);
  const subs = subtasksOfTask(taskId).map(([id, s]) => s);
  const open = subs.filter(s => !s.done);
  const hasOwn = !!(task.ownDeadlineOn && task.deadline);
  if (subs.length > 0 && open.length === 0 && !hasOwn) return "done";
  let worst = "keep";
  if (hasOwn) worst = worseStatus(worst, deadlineStatus({ done: false, waiting: false, deadline: task.deadline }));
  open.forEach(s => { worst = worseStatus(worst, deadlineStatus(s)); });
  return worst;
}
function normName(n) { return (n || "").trim().replace(/\s+/g, " ").toLowerCase(); }
function safeKey(k) { return encodeURIComponent(k).replace(/\./g, "%2E"); }

function buildNameDisplay() {
  const counts = {};
  function add(n) {
    const s = (n || "").trim().replace(/\s+/g, " ");
    if (!s) return;
    const k = s.toLowerCase();
    if (!counts[k]) counts[k] = {};
    counts[k][s] = (counts[k][s] || 0) + 1;
  }
  Object.values(tasks).forEach(t => {
    if (t.responsible) add(t.responsible);
    itemResponsibles(t).forEach(r => add(r.name));
  });
  Object.values(subtasks).forEach(s => add(s.responsible));
  const map = {};
  Object.keys(counts).forEach(k => {
    const spellings = Object.entries(counts[k]).sort((a, b) => {
      const ua = /^[A-Z]/.test(a[0]) ? 0 : 1, ub = /^[A-Z]/.test(b[0]) ? 0 : 1;
      if (ua !== ub) return ua - ub;
      if (b[1] !== a[1]) return b[1] - a[1];
      return a[0].localeCompare(b[0]);
    });
    map[k] = spellings[0][0];
  });
  nameDisplay = map;
}
function canonicalName(n) {
  const t = (n || "").trim().replace(/\s+/g, " ");
  if (!t) return "";
  return nameDisplay[t.toLowerCase()] || t;
}
function collectAllNames() {
  return Object.values(nameDisplay).sort((a, b) => a.localeCompare(b));
}
function guessMyKey() {
  if (!currentUser || !currentUser.email) return null;
  const local = currentUser.email.split("@")[0].toLowerCase();
  let best = null;
  Object.keys(nameDisplay).forEach(k => {
    if (k.length >= 2 && local.startsWith(k) && (!best || k.length > best.length)) best = k;
  });
  return best;
}
function currentMyKey() {
  const pref = userPrefs && userPrefs.myName;
  if (pref) return pref;
  return guessMyKey();
}
function nestPref(key) {
  const n = userPrefs && userPrefs.nest && userPrefs.nest[safeKey(key)];
  return { project: !!(n && n.project), status: !!(n && n.status) };
}
function setNestPref(key, partial) {
  if (!currentUser || !currentUser.uid) return;
  const next = Object.assign({}, nestPref(key), partial);
  db.ref("state/userPrefs/" + currentUser.uid + "/nest/" + safeKey(key)).set(next);
}
function sortDoneLast(entries) {
  const open = entries.filter(([id, x]) => !x.done);
  const done = entries.filter(([id, x]) => x.done).sort((a, b) => {
    const da = a[1].dateDone || "", dbb = b[1].dateDone || "";
    if (da !== dbb) return da < dbb ? -1 : 1;
    return (a[1].order || 0) - (b[1].order || 0);
  });
  return open.concat(done);
}
function displayTasksOfProject(projectId) { return sortDoneLast(tasksOfProject(projectId)); }
function displaySubtasksOfTask(taskId) { return sortDoneLast(subtasksOfTask(taskId)); }

function renderHeaderSelect() {
  const sel = document.getElementById("my-name-select");
  if (!sel) return;
  const guess = guessMyKey();
  const keys = Object.keys(nameDisplay).sort((a, b) => nameDisplay[a].localeCompare(nameDisplay[b]));
  const selected = (userPrefs && userPrefs.myName) || "";
  const autoLabel = "Auto (" + (guess ? nameDisplay[guess] : "no match") + ")";
  const sig = JSON.stringify([autoLabel, keys.map(k => nameDisplay[k]), selected]);
  if (sig === lastSelectSig) return;
  lastSelectSig = sig;
  sel.innerHTML = "";
  const o0 = document.createElement("option");
  o0.value = ""; o0.textContent = autoLabel;
  sel.appendChild(o0);
  keys.forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = nameDisplay[k];
    sel.appendChild(o);
  });
  sel.value = selected;
}
function projectHasTaskNamed(projectId, name) {

  return tasksOfProject(projectId).some(([id, t]) => (t.name || "").trim().toLowerCase() === n);

function taskHasSubtaskNamed(taskId, name) {
  const n = name.trim().toLowerCase();
  return subtasksOfTask(taskId).some(([id, s]) => (s.name || "").trim().toLowerCase() === n);
}

function toggleItemDone(kind, id) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  if (!isCheckboxEnabled(kind, id, item)) return;
  const nowDone = !item.done;
  db.ref("state/" + kind + "s/" + id).update({ done: nowDone, dateDone: nowDone ? (item.dateDone || new Date().toISOString().slice(0,10)) : "" });
  if (kind === "subtask") {
    const task = tasks[item.taskId];
    if (task && task.done) {
      const subs = subtasksOfTask(item.taskId).map(([sid, s]) => sid === id ? [sid, Object.assign({}, s, { done: nowDone })] : [sid, s]);
      if (!subs.every(([sid, s]) => s.done)) db.ref("state/tasks/" + item.taskId + "/done").set(false);
    }
  }
}

// ---------- Creating and copying ----------
function createTaskWithCopies(projectId, name, targetIds) {
  const maxOrder = Math.max(0, ...tasksOfProject(projectId).map(([id, t]) => t.order || 0));
  const data = Object.assign({ projectId, name, order: maxOrder + 1 }, defaultTaskFields());
  let groupId = null;
  if (targetIds.length > 0) {
    groupId = db.ref("state/tasks").push().key;
    data.copyGroupId = groupId;
  }
  db.ref("state/tasks").push().set(data);
  if (groupId) copyTaskInto(data, [], targetIds, groupId);
}

function copyTaskInto(src, srcSubs, targetIds, groupId) {
  targetIds.forEach(pid => {
    const maxOrder = Math.max(0, ...tasksOfProject(pid).map(([id, t]) => t.order || 0));
    const ref = db.ref("state/tasks").push();
    ref.set(Object.assign(defaultTaskFields(), {
      projectId: pid,
      name: src.name,
      order: maxOrder + 1,
      copyGroupId: groupId,
      hasSubtasks: !!src.hasSubtasks,
      responsibleMode: itemResponsibleMode(src),
      responsible: src.responsible || "",
      responsibles: itemResponsibles(src).map(r => ({ name: r.name || "", done: false })),
      notes: src.hasSubtasks ? "" : (src.notes || "")
    }));
    if (src.hasSubtasks) {
      srcSubs.forEach(([sid, s], i) => {
        db.ref("state/subtasks").push().set(Object.assign(defaultSubtaskFields(), {
          taskId: ref.key,
          name: s.name,
          order: i,
          priorityOrder: Date.now() + i,
          responsible: s.responsible || "",
          notes: s.notes || ""
        }));
      });
    }
  });
}

function addSubtaskTo(taskId, name, person) {
  const list = subtasksOfTask(taskId);
  const maxOrder = Math.max(0, ...list.map(([id, s]) => s.order || 0));
  db.ref("state/subtasks").push().set(Object.assign({ taskId, name, order: maxOrder + 1, priorityOrder: Date.now() }, defaultSubtaskFields(), { responsible: person }));
  const task = tasks[taskId];
  if (task) {
    if (!task.hasSubtasks) db.ref("state/tasks/" + taskId).update({ hasSubtasks: true, ownDeadlineOn: false });
    if (task.done) db.ref("state/tasks/" + taskId + "/done").set(false);
  }
}

function formHost(kind, ownerId) {

function closeForm() { addForm = null; render(); }

function buildTargetChecklist(candidates, getName) {
  const el = document.createElement("div");
  el.className = "targets";
  if (candidates.length === 0) {
    el.textContent = "No other projects yet.";
    return { el, selected: () => [], refresh: () => {} };
  }
  const rows = candidates.map(c => {
    const row = document.createElement("label");
    row.className = "target-row";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    const text = document.createElement("span");
    text.textContent = c.label;
    const note = document.createElement("span");
    note.className = "dup-note";
    row.appendChild(cb); row.appendChild(text); row.appendChild(note);
    return { c, cb, note, row };
  });
  if (rows.length > 1) {
    const allBtn = document.createElement("button");
    allBtn.type = "button";
    allBtn.className = "btn-text";
    allBtn.textContent = "Select all";
    allBtn.addEventListener("click", () => {
      const allOn = rows.every(r => r.cb.checked);
      rows.forEach(r => { r.cb.checked = !allOn; });
      allBtn.textContent = allOn ? "Select all" : "Clear all";
    });
    el.appendChild(allBtn);
  }
  rows.forEach(r => el.appendChild(r.row));
  function refresh() {
    const name = getName();
    rows.forEach(r => { r.note.textContent = name ? (r.c.noteFor(name) || "") : ""; });
  }
  return { el, selected: () => rows.filter(r => r.cb.checked).map(r => r.c.id), refresh };
}

// ---------- Render ----------
function render() {
  const active = document.activeElement;
  const wasInForm = !!(addForm && active && addForm.el.contains(active));
  const sel = wasInForm && active.type === "text" && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
  pendingQuillInits = [];
  buildNameDisplay();
  renderHeaderSelect();
  renderProjects();
  renderPriorityPerson();
  renderPeopleDatalist();
  pendingQuillInits.forEach(cfg => initQuillEditor(cfg));
  if (wasInForm && document.body.contains(active)) {
    active.focus();
    if (sel) { try { active.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
}

function initQuillEditor(cfg) {
  const el = document.getElementById(cfg.elId);
  if (!el) return;
  const item = cfg.kind === "task" ? tasks[cfg.id] : subtasks[cfg.id];
  if (!item) return;
  const quill = new Quill("#" + cfg.elId, {
    theme: "snow",
    modules: { toolbar: [["bold"], [{ list: "ordered" }, { list: "bullet" }], [{ color: [] }]] }
  });
  quill.root.innerHTML = item.notes || "";
  quill.on("selection-change", (range) => {
    if (range === null) {
      const html = quill.root.innerHTML;
      const currentItem = cfg.kind === "task" ? tasks[cfg.id] : subtasks[cfg.id];
      if (currentItem && html !== (currentItem.notes || "")) {
        db.ref("state/" + cfg.kind + "s/" + cfg.id + "/notes").set(html);
      }
    }
  });
}

function renderPeopleDatalist() {

function renderEditMenu(kind, id, onRename, onDelete, onCopy) {

function renderProjects() {
  const container = document.getElementById("projects-list");
  container.innerHTML = "";
  const entries = Object.entries(projects).sort(byOrder);
  entries.forEach(([projectId, project]) => {
    const box = document.createElement("div");
    box.className = "project-box";
    box.id = "project-" + projectId;
    const isExpanded = expandedProjects.has(projectId);
    const menuOpen = editMenuOpen && editMenuOpen.kind === "project" && editMenuOpen.id === projectId;
    const header = document.createElement("div");
    header.className = "project-header";
    if (!project.isOthers) header.draggable = true;
    header.innerHTML = `<span class="name">${escapeHtml(project.name)}</span>`;
    if (menuOpen) {
      header.appendChild(renderEditMenu("project", projectId, () => renameProject(projectId), () => deleteProject(projectId)));
    } else if (!project.isOthers) {
      const pencil = document.createElement("button");
      pencil.className = "btn-icon"; pencil.title = "Edit"; pencil.innerHTML = "&#9998;";
      pencil.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = { kind: "project", id: projectId }; render(); });
      header.appendChild(pencil);
      const handle = document.createElement("span");
      handle.className = "drag-handle"; handle.setAttribute("aria-hidden", "true"); handle.innerHTML = "&#8942;&#8942;";
      header.appendChild(handle);
    }
    const chevron = document.createElement("span");
    chevron.innerHTML = isExpanded ? "&#9650;" : "&#9660;";
    header.appendChild(chevron);

    header.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      if (expandedProjects.has(projectId)) { expandedProjects.delete(projectId); collapseProject(projectId); }
      else expandedProjects.add(projectId);
      render();
    });
    if (!project.isOthers) {
      header.addEventListener("dragstart", (e) => { dragState = { type: "project", id: projectId }; box.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
      header.addEventListener("dragend", () => { box.classList.remove("dragging"); dragState = null; });
      header.addEventListener("dragover", (e) => { if (dragState && dragState.type === "project") e.preventDefault(); });
      header.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!dragState || dragState.type !== "project") return;
        reorderProjectsAfterDrop(dragState.id, projectId);
        dragState = null;
      });
    }
    box.appendChild(header);

    if (isExpanded) {
      const body = document.createElement("div");
      body.className = "project-body";
      const taskList = displayTasksOfProject(projectId);
      if (taskList.length === 0) body.innerHTML = `<div class="empty-note">No tasks yet.</div>`;
      taskList.forEach(([taskId, task]) => body.appendChild(renderTaskRow(taskId, task, projectId)));
      const form = formHost("task", projectId);
      if (form) {
        body.appendChild(form);
      } else {
        const addTaskBtn = document.createElement("button");
        addTaskBtn.className = "btn btn-secondary btn-small add-btn";
        addTaskBtn.textContent = "+ Add task";
        addTaskBtn.addEventListener("click", () => openAddTaskForm(projectId));
        body.appendChild(addTaskBtn);
      }
      box.appendChild(body);
    }
    container.appendChild(box);
  });
}

      () => renameItem("task", taskId),
      () => deleteItem("task", taskId),
      () => { editMenuOpen = null; openCopyForm(taskId); }));
  } else {
    const pencil = document.createElement("button");
    pencil.className = "btn-icon"; pencil.title = "Edit"; pencil.innerHTML = "&#9998;";
    pencil.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = { kind: "task", id: taskId }; render(); });
    header.appendChild(pencil);
    const handle = document.createElement("span");
    handle.className = "drag-handle"; handle.setAttribute("aria-hidden", "true"); handle.innerHTML = "&#8942;&#8942;";
    header.appendChild(handle);
  }
  const chevron = document.createElement("span");
  chevron.innerHTML = subsOpen ? "&#9650;" : "&#9660;";
  header.appendChild(chevron);

  header.addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest('[data-role="check"]')) return;
    if (expandedTasks.has(taskId)) { expandedTasks.delete(taskId); collapseTask(taskId); }
    else expandedTasks.add(taskId);
    render();
  });
  header.addEventListener("dragstart", (e) => { dragState = { type: "task", id: taskId, projectId }; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  header.addEventListener("dragend", () => { row.classList.remove("dragging"); dragState = null; });
  header.addEventListener("dragover", (e) => { if (dragState && dragState.type === "task" && dragState.projectId === projectId && !task.done) e.preventDefault(); });
  header.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!dragState || dragState.type !== "task" || dragState.projectId !== projectId || task.done) return;
    reorderTasksAfterDrop(projectId, dragState.id, taskId);
    dragState = null;
  });
  row.appendChild(header);

  const copyForm = formHost("copy", taskId);
  if (copyForm) row.appendChild(copyForm);

  if (subsOpen) {
    const body = document.createElement("div");
    body.className = "task-row-body";
    body.appendChild(renderTaskFieldsPanel(taskId, task));
    if (task.hasSubtasks) {
      if (subs.length === 0) { const en = document.createElement("div"); en.className = "empty-note"; en.textContent = "No subtasks yet."; body.appendChild(en); }
      displaySubtasksOfTask(taskId).forEach(([subId, sub]) => body.appendChild(renderSubtaskRow(subId, sub, taskId)));
      const subForm = formHost("subtask", taskId);
      if (subForm) {
        body.appendChild(subForm);
      } else {
        const addSubBtn = document.createElement("button");
        addSubBtn.className = "btn btn-secondary btn-small add-btn";
        addSubBtn.textContent = "+ Add subtask";
        addSubBtn.addEventListener("click", () => openAddSubtaskForm(taskId));
        body.appendChild(addSubBtn);
      }
    }
    row.appendChild(body);
  }
  return row;
}

function renderSubtaskRow(subId, sub, taskId) {
  const row = document.createElement("div");

  const isExpanded = expandedSubtasks.has(subId);

    <input type="checkbox" ${sub.done ? "checked" : ""} ${enabled ? "" : "disabled"} data-role="check" />
    <span class="name">${escapeHtml(sub.name)}${sub.done && sub.dateDone ? ` <span class="done-date">(done on ${formatDMY(sub.dateDone)})</span>` : ""}</span>
    ${sub.responsible ? `<span class="meta-inline">${escapeHtml(sub.responsible)}</span>` : ""}
    ${badgeHtml(status)}
  `;
  header.querySelector('[data-role="check"]').addEventListener("click", (e) => { e.stopPropagation(); toggleItemDone("subtask", subId); });

  if (menuOpen) {
    header.appendChild(renderEditMenu("subtask", subId, () => renameItem("subtask", subId), () => deleteItem("subtask", subId)));
  } else {
    const pencil = document.createElement("button");
    pencil.className = "btn-icon"; pencil.title = "Edit"; pencil.innerHTML = "&#9998;";
    pencil.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = { kind: "subtask", id: subId }; render(); });
    header.appendChild(pencil);
    const handle = document.createElement("span");
    handle.className = "drag-handle"; handle.setAttribute("aria-hidden", "true"); handle.innerHTML = "&#8942;&#8942;";
    header.appendChild(handle);
  }
  const chevron = document.createElement("span");
  chevron.innerHTML = isExpanded ? "&#9650;" : "&#9660;";
  header.appendChild(chevron);

  header.addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest('[data-role="check"]')) return;
    if (expandedSubtasks.has(subId)) expandedSubtasks.delete(subId); else expandedSubtasks.add(subId);

  });
  header.addEventListener("dragstart", (e) => { dragState = { type: "subtask", id: subId, taskId }; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  header.addEventListener("dragend", () => { row.classList.remove("dragging"); dragState = null; });
  header.addEventListener("dragover", (e) => { if (dragState && dragState.type === "subtask" && dragState.taskId === taskId && !sub.done) e.preventDefault(); });
  header.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!dragState || dragState.type !== "subtask" || dragState.taskId !== taskId || sub.done) return;
    reorderSubtasksAfterDrop(taskId, dragState.id, subId);
    dragState = null;
  });
  row.appendChild(header);
  if (isExpanded) row.appendChild(renderSubtaskFieldsPanel(subId, sub));
  return row;
}

function renderTaskFieldsPanel(taskId, task) {

  const lockSubtasks = !!task.hasSubtasks && subs.length > 0;
  let responsibleHtml = "";
  if (mode === "single") {
    responsibleHtml = `
      <div class="full">
        <label>Responsible</label>
        <div class="mode-name-row">
          <select data-field="responsibleMode"><option value="single" selected>Single</option><option value="multiple">Multiple</option></select>
          <input type="text" data-field="responsible" value="${escapeAttr(task.responsible)}" placeholder="Name" list="people-list" />
        </div>
      </div>`;
  } else {
    const rows = itemResponsibles(task).map((r, idx) => `
      <div class="responsible-row">
        <input type="checkbox" ${r.done ? "checked" : ""} data-resp-idx="${idx}" data-resp-action="check" />
        <input type="text" value="${escapeAttr(r.name)}" data-resp-idx="${idx}" data-resp-action="name" placeholder="Name" list="people-list" />
        <button class="btn-icon" data-resp-idx="${idx}" data-resp-action="remove">&times;</button>
      </div>
    `).join("");
    responsibleHtml = `
      <div class="full">
        <label>Responsible</label>
        <div class="mode-name-row" style="margin-bottom:8px;">
          <select data-field="responsibleMode"><option value="single">Single</option><option value="multiple" selected>Multiple</option></select>
        </div>
        ${rows}
        <button class="btn btn-secondary btn-small" data-action="add-person">+ Add person</button>
      </div>`;
  }
  const quillElId = "quill-task-" + taskId;
  let lowerHtml = "";
  if (!task.hasSubtasks) {
    lowerHtml = `
      <div>
        <label>Deadline</label>
        <input type="date" data-field="deadline" value="${escapeAttr(task.deadline)}" />
      </div>
      <div class="has-subtasks-toggle" style="align-self:end;">
        <input type="checkbox" id="waiting-task-${taskId}" ${task.waiting ? "checked" : ""} />
        <label for="waiting-task-${taskId}" style="margin:0;">Waiting</label>
      </div>
      <div class="full"><label>Notes</label><div class="notes-wrap"><div id="${quillElId}"></div></div></div>`;
  } else {
    lowerHtml = `
      <div class="full">
        <label>Next deadline (from subtasks)</label>
        <div class="readonly-line">${escapeHtml(nextDeadlineText(taskId))}</div>
      </div>
      <div class="full has-subtasks-toggle">
        <input type="checkbox" id="owndl-${taskId}" ${task.ownDeadlineOn ? "checked" : ""} />
        <label for="owndl-${taskId}" style="margin:0;">This task needs its own deadline</label>
      </div>
      ${task.ownDeadlineOn ? `
        <div class="full">
          <label>Task deadline</label>
          <input type="date" data-field="deadline" value="${escapeAttr(task.deadline)}" />
        </div>` : ""}`;
  }
  fields.innerHTML = `
    <div class="full has-subtasks-toggle">
      <input type="checkbox" id="hastasks-${taskId}" ${task.hasSubtasks ? "checked" : ""} ${lockSubtasks ? "disabled" : ""} />
      <label for="hastasks-${taskId}" style="margin:0;">This task has subtasks</label>
    </div>
    ${lockSubtasks ? `<div class="full hint">Delete the subtasks to turn this off.</div>` : ""}
    ${responsibleHtml}
    <div class="full">
      <label>URL</label>
      <input type="text" data-field="url" value="${escapeAttr(task.url)}" placeholder="https://..." />
      ${task.url ? `<div style="margin-top:4px;"><a class="url-link" href="${escapeAttr(task.url)}" target="_blank" rel="noopener">Open link &#8599;</a></div>` : ""}
    </div>
    ${lowerHtml}
  `;
  const hasTasksCheckbox = fields.querySelector("#hastasks-" + taskId);
  if (hasTasksCheckbox) hasTasksCheckbox.addEventListener("change", (e) => {
    if (e.target.checked) {
      if (hasRealNotes(task.notes)) {
        const ok = confirm("This task's notes won't be shown anymore once subtasks are enabled. Copy anything important into a subtask's notes first. Continue?");
        if (!ok) { e.target.checked = false; return; }
      }
      db.ref("state/tasks/" + taskId).update({ hasSubtasks: true, ownDeadlineOn: false });
    } else {
      db.ref("state/tasks/" + taskId).update({ hasSubtasks: false, ownDeadlineOn: false });
    }
  });
  const ownDeadlineBox = fields.querySelector("#owndl-" + taskId);
  if (ownDeadlineBox) ownDeadlineBox.addEventListener("change", (e) => {
    db.ref("state/tasks/" + taskId).update({ ownDeadlineOn: e.target.checked, deadline: "" });
  });
  const waitingCheckbox = fields.querySelector("#waiting-task-" + taskId);
  if (waitingCheckbox) waitingCheckbox.addEventListener("change", (e) => updateItemField("task", taskId, "waiting", e.target.checked));
  fields.querySelectorAll('[data-field]').forEach(input => {
    input.addEventListener("change", (e) => {
      const field = e.target.dataset.field;
      if (field === "responsibleMode") setResponsibleMode("task", taskId, e.target.value);
      else if (field === "responsible") updateItemField("task", taskId, field, canonicalName(e.target.value));
      else updateItemField("task", taskId, field, e.target.value);
    });
  });
  const addPersonBtn = fields.querySelector('[data-action="add-person"]');
  if (addPersonBtn) addPersonBtn.addEventListener("click", () => addResponsiblePerson("task", taskId));
  fields.querySelectorAll('[data-resp-action]').forEach(el => {
    const idx = parseInt(el.dataset.respIdx, 10);
    const action = el.dataset.respAction;
    if (action === "check") el.addEventListener("change", (e) => updateResponsiblePerson("task", taskId, idx, "done", e.target.checked));
    if (action === "name") el.addEventListener("change", (e) => updateResponsiblePerson("task", taskId, idx, "name", canonicalName(e.target.value)));
    if (action === "remove") el.addEventListener("click", () => removeResponsiblePerson("task", taskId, idx));
  });
  if (!task.hasSubtasks) pendingQuillInits.push({ elId: quillElId, kind: "task", id: taskId });
  return fields;
}

// ---------- Priorities by person ----------
function goToItem(kind, id, taskId, task) {
  const projectId = task ? task.projectId : null;
  if (projectId) expandedProjects.add(projectId);
  if (kind === "subtask") { expandedTasks.add(taskId); expandedSubtasks.add(id); }
  else { expandedTasks.add(id); }
  render();
  setTimeout(() => {
    const el = document.getElementById((kind === "task" ? "task-" : "subtask-") + id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 50);
}

function urlLinkHtml(u) {
  return u ? `<a class="url-link" href="${escapeAttr(u)}" target="_blank" rel="noopener">Open link &#8599;</a>` : "\u2014";
}

      ? "<div style='color:#999;'>No open subtasks.</div>"
      : openSubs.map(([sid, s]) => `<div>\u2022 ${escapeHtml(s.name)}${s.responsible ? " (" + escapeHtml(s.responsible) + ")" : ""}${s.deadline ? " \u2014 " + escapeHtml(formatDMY(s.deadline)) : ""} ${badgeHtml(deadlineStatus(s))}</div>`).join("");
    detail.innerHTML = `

      <button class="btn btn-secondary btn-small" data-action="goto" style="margin-top:6px;">Go to project &#8594;</button>
    `;
  } else {

      <div><span class="label">Deadline: </span>${escapeHtml(item.deadline ? formatDMY(item.deadline) : "\u2014")}</div>

      <div><span class="label">Notes: </span>${notesHtml}</div>
      <button class="btn btn-secondary btn-small" data-action="goto">Go to project &#8594;</button>
    `;
  }
  detail.querySelector('[data-action="goto"]').addEventListener("click", () => goToItem(kind, id, taskId, task));
  return detail;
}

function buildPriorityGroups() {
  const grouped = {};
  function addEntry(key, kind, id, item, taskId) {
    if (!key) return;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push({ kind, id, item, taskId });
  }
  Object.entries(tasks).forEach(([id, t]) => {
    if (t.done) return;
    const keys = new Set();
    if (itemResponsibleMode(t) === "multiple") itemResponsibles(t).forEach(r => { if (r.name && !r.done) keys.add(normName(r.name)); });
    else if (t.responsible) keys.add(normName(t.responsible));
    keys.forEach(k => {
      if (!k) return;
      if (t.hasSubtasks) {
        const ownOpen = subtasksOfTask(id).some(([sid, s]) => !s.done && normName(s.responsible) === k);
        if (ownOpen) return;
      }
      addEntry(k, "task", id, t, null);
    });
  });
  Object.entries(subtasks).forEach(([id, s]) => {
    if (s.done || !s.responsible) return;
    const parent = tasks[s.taskId];
    if (!parent || !parent.hasSubtasks) return;
    addEntry(normName(s.responsible), "subtask", id, s, s.taskId);
  });
  return grouped;
}

function renderPriorityPerson() {
  const container = document.getElementById("priority-list-person");
  container.innerHTML = "";
  const grouped = buildPriorityGroups();
  const me = currentMyKey();
  const rawOrder = Array.isArray(personPriorityOrder) ? personPriorityOrder : Object.values(personPriorityOrder || {});
  const savedOrder = [];
  rawOrder.forEach(n => { const k = normName(n); if (k && !savedOrder.includes(k)) savedOrder.push(k); });
  const rank = (k) => { const i = savedOrder.indexOf(k); return i === -1 ? 1e9 : i; };
  const keys = Object.keys(grouped).sort((a, b) => {
    if (a === me) return -1;
    if (b === me) return 1;
    const ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    return (nameDisplay[a] || a).localeCompare(nameDisplay[b] || b);
  });
  if (keys.length === 0) { container.innerHTML = `<div class="empty-note">No open items with a responsible person yet.</div>`; return; }
  keys.forEach(k => {
    const list = grouped[k].sort((a, b) => (a.item.priorityOrder || 0) - (b.item.priorityOrder || 0));
    container.appendChild(renderPriorityGroup(k, list, keys, savedOrder, me));
  });
}

function renderPriorityGroup(key, list, visibleKeys, savedOrder, me) {
  const person = nameDisplay[key] || key;
  const isMe = key === me;
  const groupKey = "person-" + key;
  const isCollapsed = collapsedGroups.has(groupKey);
  const groupDiv = document.createElement("div");
  groupDiv.className = "priority-group";
  const header = document.createElement("div");
  header.className = "priority-group-header";
  header.draggable = !isMe;
  header.innerHTML = `${isMe ? "" : `<span class="drag-handle" title="Drag to reorder" aria-hidden="true">&#8942;&#8942;</span>`}<span class="gname">${escapeHtml(person)}</span>${isMe ? `<span class="me-chip">you</span>` : ""}<span class="count">${list.length}</span><span>${isCollapsed ? "&#9660;" : "&#9650;"}</span>`;
  header.addEventListener("click", (e) => {
    if (e.target.closest(".drag-handle")) return;
    if (collapsedGroups.has(groupKey)) collapsedGroups.delete(groupKey); else collapsedGroups.add(groupKey);
    render();
  });
  if (!isMe) {
    header.addEventListener("dragstart", () => { groupDragState = { id: key }; });
    header.addEventListener("dragend", () => { groupDragState = null; });
    header.addEventListener("dragover", (e) => { if (groupDragState) e.preventDefault(); });
    header.addEventListener("drop", (e) => {
      e.preventDefault();
      if (!groupDragState) return;
      const base = savedOrder.slice();
      visibleKeys.forEach(k => { if (!base.includes(k)) base.push(k); });
      const fromIdx = base.indexOf(groupDragState.id), toIdx = base.indexOf(key);
      if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
      const [moved] = base.splice(fromIdx, 1);
      base.splice(toIdx, 0, moved);
      db.ref("state/personPriorityOrder").set(base.map(k => nameDisplay[k] || k));
      groupDragState = null;
    });
  }
  groupDiv.appendChild(header);

  if (!isCollapsed) {
    const body = document.createElement("div");
    body.className = "priority-group-body";
    const nest = nestPref(key);
    const opts = document.createElement("div");
    opts.className = "nest-options";
    opts.innerHTML = `<label><input type="checkbox" data-nest="project" ${nest.project ? "checked" : ""} /> Group by project</label><label><input type="checkbox" data-nest="status" ${nest.status ? "checked" : ""} /> Group by status</label>`;
    opts.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => setNestPref(key, { [cb.dataset.nest]: cb.checked })));
    body.appendChild(opts);
    renderPriorityEntries(body, list, groupKey, nest);
    groupDiv.appendChild(body);
  }
  return groupDiv;
}

function renderPriorityEntries(body, list, groupKey, nest) {
  list.forEach(en => {
    const parent = en.kind === "subtask" ? tasks[en.taskId] : en.item;
    en.projectId = parent ? parent.projectId : "";
    en.status = en.kind === "subtask" ? deadlineStatus(en.item) : computeEffectiveTaskStatus(en.id, en.item);
  });
  const addItems = (container, entries, scopeKey) => entries.forEach(en => container.appendChild(renderPriorityItem(en, list, groupKey, scopeKey)));

  function subHeader(labelHtml, count, subKey, level) {
    const h = document.createElement("div");
    h.className = "subgroup-header" + (level === 2 ? " level2" : "");
    const collapsed = collapsedGroups.has(subKey);
    h.innerHTML = `<span class="gname">${labelHtml}</span><span class="count">${count}</span><span>${collapsed ? "&#9660;" : "&#9650;"}</span>`;
    h.addEventListener("click", () => {
      if (collapsedGroups.has(subKey)) collapsedGroups.delete(subKey); else collapsedGroups.add(subKey);
      render();
    });
    return { el: h, collapsed };
  }
  const statusLabel = (st) => st === "done" ? `<span class="badge badge-done">Ready to close</span>` : badgeHtml(st);
  function statusBuckets(entries) {
    return ["overdue", "urgent", "waiting", "important", "keep", "done"]
      .map(st => ({ st, entries: entries.filter(e => e.status === st) }))
      .filter(b => b.entries.length > 0);
  }
  function projectBuckets(entries) {
    const ids = [];
    entries.forEach(e => { if (!ids.includes(e.projectId)) ids.push(e.projectId); });
    ids.sort((a, b) => {
      const pa = projects[a], pb = projects[b];
      if (!pa) return 1;
      if (!pb) return -1;
      return (pa.order || 0) - (pb.order || 0);
    });
    return ids.map(pid => ({ pid, label: projects[pid] ? projects[pid].name : "No project", entries: entries.filter(e => e.projectId === pid) }));
  }
  function bodyWrap(level2) {
    const w = document.createElement("div");
    w.className = "subgroup-body" + (level2 ? " level2" : "");
    return w;
  }

  if (!nest.project && !nest.status) { addItems(body, list, groupKey); return; }

  if (nest.project) {
    projectBuckets(list).forEach(pb => {
      const pKey = groupKey + "|p:" + pb.pid;
      const ph = subHeader(escapeHtml(pb.label), pb.entries.length, pKey, 1);
      body.appendChild(ph.el);
      if (ph.collapsed) return;
      if (nest.status) {
        statusBuckets(pb.entries).forEach(sb => {
          const sKey = pKey + "|s:" + sb.st;
          const sh = subHeader(statusLabel(sb.st), sb.entries.length, sKey, 2);
          body.appendChild(sh.el);
          if (sh.collapsed) return;
          const wrap = bodyWrap(true);
          addItems(wrap, sb.entries, sKey);
          body.appendChild(wrap);
        });
      } else {
        const wrap = bodyWrap(false);
        addItems(wrap, pb.entries, pKey);
        body.appendChild(wrap);
      }
    });
  } else {
    statusBuckets(list).forEach(sb => {
      const sKey = groupKey + "|s:" + sb.st;
      const sh = subHeader(statusLabel(sb.st), sb.entries.length, sKey, 1);
      body.appendChild(sh.el);
      if (sh.collapsed) return;
      const wrap = bodyWrap(false);
      addItems(wrap, sb.entries, sKey);
      body.appendChild(wrap);
    });
  }
}

function renderPriorityItem(entry, list, groupKey, scopeKey) {
  const { kind, id, item, taskId } = entry;
  const parent = kind === "subtask" ? tasks[taskId] : item;
  const project = parent ? projects[parent.projectId] : null;
  const status = kind === "subtask" ? deadlineStatus(item) : computeEffectiveTaskStatus(id, item);
  const key = groupKey + "-" + kind + "-" + id;
  const isExpanded = expandedPriorityItems.has(key);
  let tagText = "";
  if (kind === "subtask") tagText = (parent ? parent.name : "") + (project ? " \u00b7 " + project.name : "");
  else tagText = project ? project.name : "";
  const subsList = kind === "task" && item.hasSubtasks ? subtasksOfTask(id) : [];
  const readyToClose = subsList.length > 0 && subsList.every(([sid, s]) => s.done);

  const wrap = document.createElement("div");
  wrap.className = "priority-item";
  wrap.draggable = true;

  const header = document.createElement("div");
  header.className = "priority-item-header";
  header.innerHTML = `
    <span class="drag-handle" title="Drag to reorder" aria-hidden="true">&#8942;&#8942;</span>
    <span class="name">${escapeHtml(item.name)}</span>
    ${readyToClose ? `<span class="tag-ready">ready to close</span>` : ""}
    ${badgeHtml(status)}
    ${tagText ? `<span class="tag">${escapeHtml(tagText)}</span>` : ""}
  `;
  header.addEventListener("click", (e) => {
    if (e.target.closest(".drag-handle")) return;
    if (expandedPriorityItems.has(key)) expandedPriorityItems.delete(key); else expandedPriorityItems.add(key);
    render();
  });
  wrap.appendChild(header);
  if (isExpanded) wrap.appendChild(renderPriorityDetail(kind, id, item, taskId, parent));

  wrap.addEventListener("dragstart", (e) => { dragState = { id, kind, scopeKey }; wrap.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  wrap.addEventListener("dragend", () => { wrap.classList.remove("dragging"); dragState = null; });
  wrap.addEventListener("dragover", (e) => { if (dragState && dragState.scopeKey === scopeKey) e.preventDefault(); });
  wrap.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!dragState || dragState.scopeKey !== scopeKey) return;
    const fromIdx = list.findIndex(en => en.id === dragState.id && en.kind === dragState.kind);
    const toIdx = list.findIndex(en => en.id === id && en.kind === kind);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const reordered = list.slice();
    const [moved] = reordered.splice(fromIdx, 1);
    reordered.splice(toIdx, 0, moved);
    reordered.forEach((en, i) => db.ref("state/" + en.kind + "s/" + en.id + "/priorityOrder").set(i));
  });

  return wrap;
}

function escapeHtml(str) { const div = document.createElement("div"); div.textContent = str || ""; return div.innerHTML; }
function escapeAttr(str) { return (str || "").replace(/"/g, "&quot;"); }

document.getElementById("add-project-btn").addEventListener("click", addProject);
document.getElementById("my-name-select").addEventListener("change", (e) => {
  if (!currentUser || !currentUser.uid) return;
  db.ref("state/userPrefs/" + currentUser.uid + "/myName").set(e.target.value);
});
</script>
