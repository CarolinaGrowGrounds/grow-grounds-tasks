<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow Grounds — Task Coordination</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #f4f4f0; color: #222; font-size: 15px; }
  #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
  #login-screen button, .btn { background: #2f6b3a; color: white; border: none; padding: 11px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  #login-screen button:hover, .btn:hover { background: #26582f; }
  .btn-secondary { background: white; color: #2f6b3a; border: 1px solid #2f6b3a; }
  .btn-secondary:hover { background: #eef5ee; }
  .btn-small { padding: 6px 12px; font-size: 13px; }
  .btn-icon { background: none; border: none; cursor: pointer; font-size: 15px; padding: 2px 7px; color: #666; }
  .btn-icon:hover { color: #000; }
  .btn-text { background: none; border: none; cursor: pointer; font-size: 12.5px; padding: 3px 8px; color: #2f6b3a; text-decoration: underline; }
  .btn-text.danger { color: #a33; }
  #error-banner { color: #a33; font-size: 14px; }
  #app { display: none; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; background: white; border-bottom: 1px solid #ddd; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .user-info { display: flex; align-items: center; gap: 14px; font-size: 14px; color: #555; }
  main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; padding: 20px 28px; max-width: 1500px; margin: 0 auto; align-items: start; }
  .panel { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 18px; }
  .panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
  .panel-title span { font-size: 14px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }

  .drag-handle { cursor: grab; color: #aaa; font-size: 14px; padding: 0 4px; }

  .project-box { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .project-box.dragging { opacity: 0.4; }
  .project-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; background: #fafaf7; }
  .project-header:hover { background: #f0f0ea; }
  .project-header .name { flex: 1; font-size: 16px; font-weight: 600; }
  .project-body { padding: 10px 14px 14px; border-top: 1px solid #eee; }

  .task-row { border: 1px solid #e5e5e0; border-radius: 6px; margin-bottom: 8px; background: #fdfdfb; }
  .task-row.dragging { opacity: 0.4; }
  .task-row-header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; }
  .task-row-header .name { flex: 1; font-size: 14.5px; font-weight: 500; }
  .task-row-body { border-top: 1px solid #eee; padding: 10px 12px 12px 20px; }

  .subtask-row { border: 1px solid #eee; border-radius: 5px; margin-bottom: 6px; background: white; }
  .subtask-row.dragging { opacity: 0.4; }
  .subtask-row-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; }
  .subtask-row-header .name { flex: 1; font-size: 14px; }
  .meta-inline { font-size: 12px; color: #888; white-space: nowrap; }

  .fields-panel { border-top: 1px solid #eee; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
  .fields-panel label { display: block; color: #666; margin-bottom: 3px; font-size: 12px; }
  .fields-panel input, .fields-panel textarea, .fields-panel select { width: 100%; font-size: 13px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
  .fields-panel .full { grid-column: 1 / 3; }
  .fields-panel .actions { grid-column: 1 / 3; display: flex; justify-content: flex-end; }
  .fields-panel textarea { resize: vertical; max-width: 100%; }
  .responsible-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .responsible-row input[type="checkbox"] { width: auto; flex: none; }
  .responsible-row input[type="text"] { width: auto; flex: 1; }
  .mode-name-row { display: flex; gap: 8px; align-items: center; }
  .mode-name-row select { width: 110px; flex: none; }
  .mode-name-row input[type="text"] { flex: 1; }

  .badge { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .badge-overdue { background: #d9c2a3; color: #5c3d1a; }
  .badge-urgent { background: #f3b3b3; color: #7a1f1f; }
  .badge-important { background: #f7e79b; color: #6b5b00; }
  .badge-keep { background: #f0f0ec; color: #888; }
  .badge-done { background: #c8e6c9; color: #1b5e20; }

  .add-btn { margin-top: 6px; }

  .priority-group { margin-bottom: 12px; border: 1px solid #e5e5e0; border-radius: 8px; overflow: hidden; }
  .priority-group-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; background: #eef5ee; }
  .priority-group-header .gname { flex: 1; font-size: 15px; font-weight: 700; color: #1b4d24; }
  .priority-group-header .count { font-size: 11.5px; color: #4a7a52; background: #d8ecd9; padding: 2px 8px; border-radius: 10px; }
  .priority-group-body { padding: 8px 10px 10px; }
  .priority-item { border: 1px solid #e5e5e0; border-radius: 6px; margin-bottom: 6px; background: white; }
  .priority-item.dragging { opacity: 0.4; }
  .priority-item-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; font-size: 13.5px; }
  .priority-item-header .name { flex: 1; }
  .priority-item-header .tag { font-size: 11.5px; color: #888; white-space: nowrap; }
  .priority-item-detail { border-top: 1px solid #eee; padding: 10px; font-size: 13px; color: #444; }
  .priority-item-detail div { margin-bottom: 4px; }
  .priority-item-detail .label { color: #888; font-size: 11.5px; }

  .empty-note { font-size: 13px; color: #999; padding: 10px 0; }
  a.url-link { color: #2f6b3a; text-decoration: underline; }
  .done-date { font-size: 12px; color: #1b5e20; font-weight: 500; }
  .ql-container { background: white; font-size: 13px; }
  .ql-editor { min-height: 80px; }
  .has-subtasks-toggle { display: flex; align-items: center; gap: 6px; }
  .has-subtasks-toggle input { width: auto; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Grow Grounds — Task Coordination</h1>
  <button id="login-btn">Sign in with Google</button>
  <div id="error-banner"></div>
</div>

<div id="app">
  <header>
    <h1>Grow Grounds — Task Coordination</h1>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="btn btn-secondary btn-small" id="signout-btn">Sign out</button>
    </div>
  </header>
  <main>
    <div class="panel">
      <div class="panel-title">
        <span>Projects</span>
        <button class="btn btn-small" id="add-project-btn">+ Add project</button>
      </div>
      <div id="projects-list"></div>
    </div>
    <div class="panel">
      <div class="panel-title"><span>Priorities by person</span></div>
      <div id="priority-list-person"></div>
    </div>
  </main>
</div>

<datalist id="people-list"></datalist>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBR_2hJsWxVPysMR5WM52viie0nLw81w14",
  authDomain: "task-tracker-43ec2.firebaseapp.com",
  databaseURL: "https://task-tracker-43ec2-default-rtdb.firebaseio.com",
  projectId: "task-tracker-43ec2",
  storageBucket: "task-tracker-43ec2.firebasestorage.app",
  messagingSenderId: "960268998510",
  appId: "1:960268998510:web:87802ede5d057994c0937f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ALLOWED_DOMAIN = "growgrounds.org";

let projects = {};
let tasks = {};
let subtasks = {};
let currentUser = null;
let expandedProjects = new Set();
let expandedTasks = new Set();
let expandedSubtasks = new Set();
let expandedPriorityItems = new Set();
let collapsedGroups = new Set();
let editMenuOpen = null;
let dragState = null;
let groupDragState = null;
let personPriorityOrder = [];
let pendingQuillInits = [];

document.getElementById("login-btn").addEventListener("click", () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    document.getElementById("error-banner").textContent = "Sign-in failed: " + err.message;
  });
});
document.getElementById("signout-btn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(user => {
  const errorBanner = document.getElementById("error-banner");
  if (user) {
    if (!user.email.endsWith("@" + ALLOWED_DOMAIN)) {
      errorBanner.textContent = "Access restricted to @" + ALLOWED_DOMAIN + " accounts.";
      auth.signOut();
      return;
    }
    currentUser = user;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-email").textContent = user.email;
    errorBanner.textContent = "";
    startListeners();
  } else {
    currentUser = null;
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

function startListeners() {
  db.ref("state/projects").on("value", snap => { projects = snap.val() || {}; ensureGeneralProject(); render(); });
  db.ref("state/tasks").on("value", snap => { tasks = snap.val() || {}; render(); });
  db.ref("state/subtasks").on("value", snap => { subtasks = snap.val() || {}; render(); });
  db.ref("state/personPriorityOrder").on("value", snap => { personPriorityOrder = snap.val() || []; render(); });
}

function ensureGeneralProject() {
  const existing = Object.entries(projects).find(([id, p]) => p.isOthers);
  if (!existing) {
    db.ref("state/projects").push().set({ name: "General Tasks", isOthers: true, order: -1, createdAt: Date.now() });
  } else if (existing[1].name !== "General Tasks") {
    db.ref("state/projects/" + existing[0] + "/name").set("General Tasks");
  }
}

function defaultItemFields() {
  return { responsibleMode: "single", responsible: "", responsibles: [], deadline: "", url: "", dateDone: "", notes: "", done: false };
}
function itemResponsibleMode(item) { return item.responsibleMode || "single"; }
function itemResponsibles(item) { return item.responsibles || []; }
function allResponsiblesDone(item) {
  const list = itemResponsibles(item);
  if (list.length === 0) return true;
  return list.every(r => r.done);
}
function isCheckboxEnabled(kind, id, item) {
  let enabled = true;
  if (kind === "task" && item.hasSubtasks) {
    const subs = subtasksOfTask(id);
    if (subs.length > 0) enabled = subs.every(([sid, s]) => s.done);
  }
  if (!item.hasSubtasks && itemResponsibleMode(item) === "multiple") enabled = enabled && allResponsiblesDone(item);
  return enabled;
}
function deadlineStatus(item) {
  if (item.done) return "done";
  if (!item.deadline) return "keep";
  const today = new Date(); today.setHours(0,0,0,0);
  const deadline = new Date(item.deadline + "T00:00:00");
  const diffDays = Math.round((deadline - today) / 86400000);
  if (diffDays < 0) return "overdue";
  if (diffDays <= 7) return "urgent";
  if (diffDays <= 30) return "important";
  return "keep";
}
const STATUS_LABEL = { overdue: "Overdue", urgent: "Urgent", important: "Important", keep: "Keep in mind", done: "Done" };
function badgeHtml(status) { return `<span class="badge badge-${status}">${STATUS_LABEL[status]}</span>`; }
function responsibleSummary(item) {
  if (itemResponsibleMode(item) === "multiple") {
    const list = itemResponsibles(item);
    if (list.length === 0) return "";
    return list.map(r => r.name).filter(Boolean).join(", ");
  }
  return item.responsible || "";
}
function formatDMY(isoDate) {
  if (!isoDate) return "";
  const [y, m, d] = isoDate.split("-");
  return d + "-" + m + "-" + y;
}
function subtasksOfTask(taskId) {
  return Object.entries(subtasks).filter(([id, s]) => s.taskId === taskId).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
}
function tasksOfProject(projectId) {
  return Object.entries(tasks).filter(([id, t]) => t.projectId === projectId).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
}
function collectAllNames() {
  const names = new Set();
  Object.values(tasks).forEach(t => {
    if (itemResponsibleMode(t) === "multiple") itemResponsibles(t).forEach(r => r.name && names.add(r.name));
    else if (t.responsible) names.add(t.responsible);
  });
  Object.values(subtasks).forEach(s => {
    if (itemResponsibleMode(s) === "multiple") itemResponsibles(s).forEach(r => r.name && names.add(r.name));
    else if (s.responsible) names.add(s.responsible);
  });
  return Array.from(names).sort();
}

// ---------- Projects ----------
function addProject() {
  const name = prompt("Project name:");
  if (!name) return;
  const maxOrder = Math.max(0, ...Object.values(projects).map(p => p.order || 0));
  db.ref("state/projects").push().set({ name, isOthers: false, order: maxOrder + 1, createdAt: Date.now() });
}
function renameProject(projectId) {
  const project = projects[projectId];
  const newName = prompt("Rename project:", project.name);
  if (!newName || newName === project.name) return;
  db.ref("state/projects/" + projectId + "/name").set(newName);
}
function deleteProject(projectId) {
  if (!confirm("Delete this project and all its tasks and subtasks? This cannot be undone.")) return;
  tasksOfProject(projectId).forEach(([taskId]) => {
    subtasksOfTask(taskId).forEach(([subId]) => db.ref("state/subtasks/" + subId).remove());
    db.ref("state/tasks/" + taskId).remove();
  });
  db.ref("state/projects/" + projectId).remove();
  expandedProjects.delete(projectId);
  editMenuOpen = null;
}
function collapseProject(projectId) {
  tasksOfProject(projectId).forEach(([taskId]) => {
    expandedTasks.delete(taskId);
    subtasksOfTask(taskId).forEach(([subId]) => expandedSubtasks.delete(subId));
  });
}
function reorderProjectsAfterDrop(draggedId, targetId) {
  const list = Object.entries(projects).filter(([id, p]) => !p.isOthers).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
  const ids = list.map(([id]) => id);
  const fromIdx = ids.indexOf(draggedId), toIdx = ids.indexOf(targetId);
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const reordered = list.slice();
  const [moved] = reordered.splice(fromIdx, 1);
  reordered.splice(toIdx, 0, moved);
  reordered.forEach(([id], i) => db.ref("state/projects/" + id + "/order").set(i));
}

// ---------- Tasks ----------
function addTask(projectId) {
  const name = prompt("Task name:");
  if (!name) return;
  const list = tasksOfProject(projectId);
  const maxOrder = Math.max(0, ...list.map(([id, t]) => t.order || 0));
  db.ref("state/tasks").push().set(Object.assign({ projectId, name, hasSubtasks: false, order: maxOrder + 1 }, defaultItemFields()));
}
function collapseTask(taskId) {
  subtasksOfTask(taskId).forEach(([subId]) => expandedSubtasks.delete(subId));
}
function toggleItemDone(kind, id) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  if (!isCheckboxEnabled(kind, id, item)) return;
  const nowDone = !item.done;
  db.ref("state/" + kind + "s/" + id).update({ done: nowDone, dateDone: nowDone ? (item.dateDone || new Date().toISOString().slice(0,10)) : "" });
  if (kind === "subtask") {
    const task = tasks[item.taskId];
    if (task && task.done) {
      const subs = subtasksOfTask(item.taskId).map(([sid, s]) => sid === id ? [sid, Object.assign({}, s, { done: nowDone })] : [sid, s]);
      if (!subs.every(([sid, s]) => s.done)) db.ref("state/tasks/" + item.taskId + "/done").set(false);
    }
  }
}
function updateItemField(kind, id, field, value) { db.ref("state/" + kind + "s/" + id + "/" + field).set(value); }
function renameItem(kind, id) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  const newName = prompt("Rename:", item.name);
  if (!newName || newName === item.name) return;
  db.ref("state/" + kind + "s/" + id + "/name").set(newName);
  editMenuOpen = null;
}
function setResponsibleMode(kind, id, mode) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  const updates = { responsibleMode: mode };
  if (mode === "multiple" && itemResponsibles(item).length === 0 && item.responsible) updates.responsibles = [{ name: item.responsible, done: false }];
  db.ref("state/" + kind + "s/" + id).update(updates);
}
function addResponsiblePerson(kind, id) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  const list = itemResponsibles(item).slice();
  list.push({ name: "", done: false });
  db.ref("state/" + kind + "s/" + id + "/responsibles").set(list);
}
function updateResponsiblePerson(kind, id, idx, field, value) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  const list = itemResponsibles(item).slice();
  list[idx] = Object.assign({}, list[idx], { [field]: value });
  db.ref("state/" + kind + "s/" + id + "/responsibles").set(list);
  if (field === "done" && !value) db.ref("state/" + kind + "s/" + id + "/done").set(false);
}
function removeResponsiblePerson(kind, id, idx) {
  const item = kind === "task" ? tasks[id] : subtasks[id];
  const list = itemResponsibles(item).slice();
  list.splice(idx, 1);
  db.ref("state/" + kind + "s/" + id + "/responsibles").set(list);
}
function addSubtask(taskId) {
  const name = prompt("Subtask name:");
  if (!name) return;
  const list = subtasksOfTask(taskId);
  const maxOrder = Math.max(0, ...list.map(([id, s]) => s.order || 0));
  db.ref("state/subtasks").push().set(Object.assign({ taskId, name, order: maxOrder + 1, priorityOrder: Date.now() }, defaultItemFields()));
  const task = tasks[taskId];
  if (task && task.done) db.ref("state/tasks/" + taskId + "/done").set(false);
}
function deleteItem(kind, id) {
  const label = kind === "task" ? "task" : "subtask";
  if (!confirm("Delete this " + label + "? This cannot be undone.")) return;
  if (kind === "task") {
    subtasksOfTask(id).forEach(([subId]) => db.ref("state/subtasks/" + subId).remove());
    db.ref("state/tasks/" + id).remove();
    expandedTasks.delete(id);
  } else {
    db.ref("state/subtasks/" + id).remove();
    expandedSubtasks.delete(id);
  }
  editMenuOpen = null;
}
function reorderTasksAfterDrop(projectId, draggedId, targetId) {
  const list = tasksOfProject(projectId);
  const ids = list.map(([id]) => id);
  const fromIdx = ids.indexOf(draggedId), toIdx = ids.indexOf(targetId);
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const reordered = list.slice();
  const [moved] = reordered.splice(fromIdx, 1);
  reordered.splice(toIdx, 0, moved);
  reordered.forEach(([id], i) => db.ref("state/tasks/" + id + "/order").set(i));
}
function reorderSubtasksAfterDrop(taskId, draggedId, targetId) {
  const list = subtasksOfTask(taskId);
  const ids = list.map(([id]) => id);
  const fromIdx = ids.indexOf(draggedId), toIdx = ids.indexOf(targetId);
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const reordered = list.slice();
  const [moved] = reordered.splice(fromIdx, 1);
  reordered.splice(toIdx, 0, moved);
  reordered.forEach(([id], i) => db.ref("state/subtasks/" + id + "/order").set(i));
}

// ---------- Render ----------
function render() {
  pendingQuillInits = [];
  renderProjects();
  renderPriorityPerson();
  renderPeopleDatalist();
  pendingQuillInits.forEach(cfg => initQuillEditor(cfg));
}

function initQuillEditor(cfg) {
  const el = document.getElementById(cfg.elId);
  if (!el) return;
  const item = cfg.kind === "task" ? tasks[cfg.id] : subtasks[cfg.id];
  if (!item) return;
  const quill = new Quill("#" + cfg.elId, {
    theme: "snow",
    modules: { toolbar: [["bold"], [{ list: "ordered" }, { list: "bullet" }], [{ color: [] }]] }
  });
  quill.root.innerHTML = item.notes || "";
  quill.on("selection-change", (range) => {
    if (range === null) {
      const html = quill.root.innerHTML;
      const currentItem = cfg.kind === "task" ? tasks[cfg.id] : subtasks[cfg.id];
      if (currentItem && html !== (currentItem.notes || "")) {
        db.ref("state/" + cfg.kind + "s/" + cfg.id + "/notes").set(html);
      }
    }
  });
}

function renderPeopleDatalist() {
  const dl = document.getElementById("people-list");
  dl.innerHTML = collectAllNames().map(n => `<option value="${escapeAttr(n)}"></option>`).join("");
}

function renderEditMenu(kind, id, onRename, onDelete) {
  const wrap = document.createElement("span");
  wrap.style.display = "inline-flex";
  wrap.style.gap = "4px";
  const renameBtn = document.createElement("button");
  renameBtn.className = "btn-text";
  renameBtn.textContent = "Rename";
  renameBtn.addEventListener("click", (e) => { e.stopPropagation(); onRename(); });
  const deleteBtn = document.createElement("button");
  deleteBtn.className = "btn-text danger";
  deleteBtn.textContent = "Delete";
  deleteBtn.addEventListener("click", (e) => { e.stopPropagation(); onDelete(); });
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "btn-icon";
  cancelBtn.textContent = "\u00d7";
  cancelBtn.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = null; render(); });
  wrap.appendChild(renameBtn); wrap.appendChild(deleteBtn); wrap.appendChild(cancelBtn);
  return wrap;
}

function renderProjects() {
  const container = document.getElementById("projects-list");
  container.innerHTML = "";
  const entries = Object.entries(projects).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
  entries.forEach(([projectId, project]) => {
    const box = document.createElement("div");
    box.className = "project-box";
    box.id = "project-" + projectId;
    const isExpanded = expandedProjects.has(projectId);
    const menuOpen = editMenuOpen && editMenuOpen.kind === "project" && editMenuOpen.id === projectId;
    const header = document.createElement("div");
    header.className = "project-header";
    if (!project.isOthers) header.draggable = true;
    header.innerHTML = `<span class="name">${escapeHtml(project.name)}</span>`;
    if (menuOpen) {
      header.appendChild(renderEditMenu("project", projectId, () => renameProject(projectId), () => deleteProject(projectId)));
    } else if (!project.isOthers) {
      const pencil = document.createElement("button");
      pencil.className = "btn-icon"; pencil.title = "Edit"; pencil.innerHTML = "&#9998;";
      pencil.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = { kind: "project", id: projectId }; render(); });
      header.appendChild(pencil);
      const handle = document.createElement("span");
      handle.className = "drag-handle"; handle.setAttribute("aria-hidden", "true"); handle.innerHTML = "&#8942;&#8942;";
      header.appendChild(handle);
    }
    const chevron = document.createElement("span");
    chevron.innerHTML = isExpanded ? "&#9650;" : "&#9660;";
    header.appendChild(chevron);

    header.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      if (expandedProjects.has(projectId)) { expandedProjects.delete(projectId); collapseProject(projectId); }
      else expandedProjects.add(projectId);
      render();
    });
    if (!project.isOthers) {
      header.addEventListener("dragstart", (e) => { dragState = { type: "project", id: projectId }; box.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
      header.addEventListener("dragend", () => { box.classList.remove("dragging"); dragState = null; });
      header.addEventListener("dragover", (e) => { if (dragState && dragState.type === "project") e.preventDefault(); });
      header.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!dragState || dragState.type !== "project") return;
        reorderProjectsAfterDrop(dragState.id, projectId);
        dragState = null;
      });
    }
    box.appendChild(header);

    if (isExpanded) {
      const body = document.createElement("div");
      body.className = "project-body";
      const taskList = tasksOfProject(projectId);
      if (taskList.length === 0) body.innerHTML = `<div class="empty-note">No tasks yet.</div>`;
      taskList.forEach(([taskId, task]) => body.appendChild(renderTaskRow(taskId, task, projectId)));
      const addTaskBtn = document.createElement("button");
      addTaskBtn.className = "btn btn-secondary btn-small add-btn";
      addTaskBtn.textContent = "+ Add task";
      addTaskBtn.addEventListener("click", () => addTask(projectId));
      body.appendChild(addTaskBtn);
      box.appendChild(body);
    }
    container.appendChild(box);
  });
}

function renderTaskRow(taskId, task, projectId) {
  const row = document.createElement("div");
  row.className = "task-row";
  row.id = "task-" + taskId;
  const subs = subtasksOfTask(taskId);
  const subsOpen = expandedTasks.has(taskId);
  const status = deadlineStatus(task);
  const enabled = isCheckboxEnabled("task", taskId, task);
  const respSummary = responsibleSummary(task);
  const menuOpen = editMenuOpen && editMenuOpen.kind === "task" && editMenuOpen.id === taskId;

  const header = document.createElement("div");
  header.className = "task-row-header";
  header.draggable = true;
  header.innerHTML = `
    <input type="checkbox" ${task.done ? "checked" : ""} ${enabled ? "" : "disabled"} data-role="check" />
    <span class="name">${escapeHtml(task.name)}${task.done && task.dateDone ? ` <span class="done-date">(done on ${formatDMY(task.dateDone)})</span>` : ""}</span>
    ${respSummary ? `<span class="meta-inline">${escapeHtml(respSummary)}</span>` : ""}
    ${badgeHtml(status)}
  `;
  header.querySelector('[data-role="check"]').addEventListener("click", (e) => { e.stopPropagation(); toggleItemDone("task", taskId); });

  if (menuOpen) {
    header.appendChild(renderEditMenu("task", taskId, () => renameItem("task", taskId), () => deleteItem("task", taskId)));
  } else {
    const pencil = document.createElement("button");
    pencil.className = "btn-icon"; pencil.title = "Edit"; pencil.innerHTML = "&#9998;";
    pencil.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = { kind: "task", id: taskId }; render(); });
    header.appendChild(pencil);
    const handle = document.createElement("span");
    handle.className = "drag-handle"; handle.setAttribute("aria-hidden", "true"); handle.innerHTML = "&#8942;&#8942;";
    header.appendChild(handle);
  }
  const chevron = document.createElement("span");
  chevron.innerHTML = subsOpen ? "&#9650;" : "&#9660;";
  header.appendChild(chevron);

  header.addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest('[data-role="check"]')) return;
    if (expandedTasks.has(taskId)) { expandedTasks.delete(taskId); collapseTask(taskId); }
    else expandedTasks.add(taskId);
    render();
  });
  header.addEventListener("dragstart", (e) => { dragState = { type: "task", id: taskId, projectId }; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  header.addEventListener("dragend", () => { row.classList.remove("dragging"); dragState = null; });
  header.addEventListener("dragover", (e) => { if (dragState && dragState.type === "task" && dragState.projectId === projectId) e.preventDefault(); });
  header.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!dragState || dragState.type !== "task" || dragState.projectId !== projectId) return;
    reorderTasksAfterDrop(projectId, dragState.id, taskId);
    dragState = null;
  });
  row.appendChild(header);

  if (subsOpen) {
    const body = document.createElement("div");
    body.className = "task-row-body";
    body.appendChild(renderFieldsPanel("task", taskId, task));
    if (task.hasSubtasks) {
      if (subs.length === 0) { const en = document.createElement("div"); en.className = "empty-note"; en.textContent = "No subtasks yet."; body.appendChild(en); }
      subs.forEach(([subId, sub]) => body.appendChild(renderSubtaskRow(subId, sub, taskId)));
      const addSubBtn = document.createElement("button");
      addSubBtn.className = "btn btn-secondary btn-small add-btn";
      addSubBtn.textContent = "+ Add subtask";
      addSubBtn.addEventListener("click", () => addSubtask(taskId));
      body.appendChild(addSubBtn);
    }
    row.appendChild(body);
  }
  return row;
}

function renderSubtaskRow(subId, sub, taskId) {
  const row = document.createElement("div");
  row.className = "subtask-row";
  row.id = "subtask-" + subId;
  const isExpanded = expandedSubtasks.has(subId);
  const status = deadlineStatus(sub);
  const enabled = isCheckboxEnabled("subtask", subId, sub);
  const respSummary = responsibleSummary(sub);
  const menuOpen = editMenuOpen && editMenuOpen.kind === "subtask" && editMenuOpen.id === subId;

  const header = document.createElement("div");
  header.className = "subtask-row-header";
  header.draggable = true;
  header.innerHTML = `
    <input type="checkbox" ${sub.done ? "checked" : ""} ${enabled ? "" : "disabled"} data-role="check" />
    <span class="name">${escapeHtml(sub.name)}${sub.done && sub.dateDone ? ` <span class="done-date">(done on ${formatDMY(sub.dateDone)})</span>` : ""}</span>
    ${respSummary ? `<span class="meta-inline">${escapeHtml(respSummary)}</span>` : ""}
    ${badgeHtml(status)}
  `;
  header.querySelector('[data-role="check"]').addEventListener("click", (e) => { e.stopPropagation(); toggleItemDone("subtask", subId); });

  if (menuOpen) {
    header.appendChild(renderEditMenu("subtask", subId, () => renameItem("subtask", subId), () => deleteItem("subtask", subId)));
  } else {
    const pencil = document.createElement("button");
    pencil.className = "btn-icon"; pencil.title = "Edit"; pencil.innerHTML = "&#9998;";
    pencil.addEventListener("click", (e) => { e.stopPropagation(); editMenuOpen = { kind: "subtask", id: subId }; render(); });
    header.appendChild(pencil);
    const handle = document.createElement("span");
    handle.className = "drag-handle"; handle.setAttribute("aria-hidden", "true"); handle.innerHTML = "&#8942;&#8942;";
    header.appendChild(handle);
  }
  const chevron = document.createElement("span");
  chevron.innerHTML = isExpanded ? "&#9650;" : "&#9660;";
  header.appendChild(chevron);

  header.addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest('[data-role="check"]')) return;
    if (expandedSubtasks.has(subId)) expandedSubtasks.delete(subId); else expandedSubtasks.add(subId);
    render();
  });
  header.addEventListener("dragstart", (e) => { dragState = { type: "subtask", id: subId, taskId }; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  header.addEventListener("dragend", () => { row.classList.remove("dragging"); dragState = null; });
  header.addEventListener("dragover", (e) => { if (dragState && dragState.type === "subtask" && dragState.taskId === taskId) e.preventDefault(); });
  header.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!dragState || dragState.type !== "subtask" || dragState.taskId !== taskId) return;
    reorderSubtasksAfterDrop(taskId, dragState.id, subId);
    dragState = null;
  });
  row.appendChild(header);
  if (isExpanded) row.appendChild(renderFieldsPanel("subtask", subId, sub));
  return row;
}

function renderFieldsPanel(kind, id, item) {
  const fields = document.createElement("div");
  fields.className = "fields-panel";
  const mode = itemResponsibleMode(item);
  let responsibleHtml = "";
  if (mode === "single") {
    responsibleHtml = `
      <div class="full">
        <label>Responsible</label>
        <div class="mode-name-row">
          <select data-field="responsibleMode"><option value="single" selected>Single</option><option value="multiple">Multiple</option></select>
          <input type="text" data-field="responsible" value="${escapeAttr(item.responsible)}" placeholder="Name" list="people-list" />
        </div>
      </div>`;
  } else {
    const rows = itemResponsibles(item).map((r, idx) => `
      <div class="responsible-row">
        <input type="checkbox" ${r.done ? "checked" : ""} data-resp-idx="${idx}" data-resp-action="check" />
        <input type="text" value="${escapeAttr(r.name)}" data-resp-idx="${idx}" data-resp-action="name" placeholder="Name" list="people-list" />
        <button class="btn-icon" data-resp-idx="${idx}" data-resp-action="remove">&times;</button>
      </div>
    `).join("");
    responsibleHtml = `
      <div class="full">
        <label>Responsible</label>
        <div class="mode-name-row" style="margin-bottom:8px;">
          <select data-field="responsibleMode"><option value="single">Single</option><option value="multiple" selected>Multiple</option></select>
        </div>
        ${rows}
        <button class="btn btn-secondary btn-small" data-action="add-person">+ Add person</button>
      </div>`;
  }
  const quillElId = "quill-" + kind + "-" + id;
  fields.innerHTML = `
    ${kind === "task" ? `
      <div class="full has-subtasks-toggle">
        <input type="checkbox" id="hastasks-${id}" ${item.hasSubtasks ? "checked" : ""} />
        <label for="hastasks-${id}" style="margin:0;">This task has subtasks</label>
      </div>` : ""}
    ${responsibleHtml}
    <div class="full">
      <label>URL</label>
      <input type="text" data-field="url" value="${escapeAttr(item.url)}" placeholder="https://..." />
      ${item.url ? `<div style="margin-top:4px;"><a class="url-link" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">Open link &#8599;</a></div>` : ""}
    </div>
    <div><label>Deadline</label><input type="date" data-field="deadline" value="${escapeAttr(item.deadline)}" /></div>
    <div class="full"><label>Notes</label><div id="${quillElId}"></div></div>
  `;
  const hasTasksCheckbox = fields.querySelector("#hastasks-" + id);
  if (hasTasksCheckbox) hasTasksCheckbox.addEventListener("change", (e) => updateItemField("task", id, "hasSubtasks", e.target.checked));
  fields.querySelectorAll('[data-field]').forEach(input => {
    input.addEventListener("change", (e) => {
      const field = e.target.dataset.field;
      if (field === "responsibleMode") setResponsibleMode(kind, id, e.target.value);
      else updateItemField(kind, id, field, e.target.value);
    });
  });
  const addPersonBtn = fields.querySelector('[data-action="add-person"]');
  if (addPersonBtn) addPersonBtn.addEventListener("click", () => addResponsiblePerson(kind, id));
  fields.querySelectorAll('[data-resp-action]').forEach(el => {
    const idx = parseInt(el.dataset.respIdx, 10);
    const action = el.dataset.respAction;
    if (action === "check") el.addEventListener("change", (e) => updateResponsiblePerson(kind, id, idx, "done", e.target.checked));
    if (action === "name") el.addEventListener("change", (e) => updateResponsiblePerson(kind, id, idx, "name", e.target.value));
    if (action === "remove") el.addEventListener("click", () => removeResponsiblePerson(kind, id, idx));
  });
  pendingQuillInits.push({ elId: quillElId, kind, id });
  return fields;
}

function goToItem(kind, id, taskId, task) {
  const projectId = task ? task.projectId : null;
  if (projectId) expandedProjects.add(projectId);
  if (kind === "subtask") { expandedTasks.add(taskId); expandedSubtasks.add(id); }
  render();
  setTimeout(() => {
    const el = document.getElementById((kind === "task" ? "task-" : "subtask-") + id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 50);
}

function renderPriorityDetail(kind, id, item, taskId, task) {
  const detail = document.createElement("div");
  detail.className = "priority-item-detail";
  detail.innerHTML = `
    <div><span class="label">Deadline: </span>${escapeHtml(item.deadline || "—")}</div>
    <div><span class="label">URL: </span>${item.url ? `<a class="url-link" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">Open link &#8599;</a>` : "—"}</div>
    <div><span class="label">Notes: </span>${item.notes ? `<div style="display:inline-block; vertical-align:top;">${item.notes}</div>` : "—"}</div>
    <button class="btn btn-secondary btn-small" data-action="goto">Go to project &#8594;</button>
  `;
  detail.querySelector('[data-action="goto"]').addEventListener("click", () => goToItem(kind, id, taskId, task));
  return detail;
}

function renderPriorityPerson() {
  const container = document.getElementById("priority-list-person");
  container.innerHTML = "";
  const grouped = {};
  function addEntry(personName, kind, id, item, taskId) {
    if (!grouped[personName]) grouped[personName] = [];
    grouped[personName].push({ kind, id, item, taskId });
  }
  Object.entries(tasks).forEach(([id, t]) => {
    if (t.done || t.hasSubtasks) return;
    if (itemResponsibleMode(t) === "multiple") itemResponsibles(t).forEach(r => { if (r.name && !r.done) addEntry(r.name, "task", id, t, null); });
    else if (t.responsible) addEntry(t.responsible, "task", id, t, null);
  });
  Object.entries(subtasks).forEach(([id, s]) => {
    if (s.done) return;
    if (itemResponsibleMode(s) === "multiple") itemResponsibles(s).forEach(r => { if (r.name && !r.done) addEntry(r.name, "subtask", id, s, s.taskId); });
    else if (s.responsible) addEntry(s.responsible, "subtask", id, s, s.taskId);
  });
  const people = Object.keys(grouped).sort((a, b) => {
    const ia = personPriorityOrder.indexOf(a), ib = personPriorityOrder.indexOf(b);
    const ra = ia === -1 ? 1e9 : ia, rb = ib === -1 ? 1e9 : ib;
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b);
  });
  if (people.length === 0) { container.innerHTML = `<div class="empty-note">No open items with a responsible person yet.</div>`; return; }
  const currentOrder = people.slice();
  people.forEach(person => {
    const list = grouped[person].sort((a, b) => (a.item.priorityOrder || 0) - (b.item.priorityOrder || 0));
    container.appendChild(renderPriorityGroup(person, list, currentOrder));
  });
}

function renderPriorityGroup(person, list, currentOrder) {
  const groupKey = "person-" + person;
  const isCollapsed = collapsedGroups.has(groupKey);
  const groupDiv = document.createElement("div");
  groupDiv.className = "priority-group";
  const header = document.createElement("div");
  header.className = "priority-group-header";
  header.draggable = true;
  header.innerHTML = `<span class="drag-handle" title="Drag to reorder" aria-hidden="true">&#8942;&#8942;</span><span class="gname">${escapeHtml(person)}</span><span class="count">${list.length}</span><span>${isCollapsed ? "&#9660;" : "&#9650;"}</span>`;
  header.addEventListener("click", (e) => {
    if (e.target.closest(".drag-handle")) return;
    if (collapsedGroups.has(groupKey)) collapsedGroups.delete(groupKey); else collapsedGroups.add(groupKey);
    render();
  });
  header.addEventListener("dragstart", () => { groupDragState = { id: person }; });
  header.addEventListener("dragover", (e) => { e.preventDefault(); });
  header.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!groupDragState) return;
    const order = currentOrder.slice();
    const fromIdx = order.indexOf(groupDragState.id);
    const toIdx = order.indexOf(person);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const [moved] = order.splice(fromIdx, 1);
    order.splice(toIdx, 0, moved);
    db.ref("state/personPriorityOrder").set(order);
    groupDragState = null;
  });
  groupDiv.appendChild(header);

  if (!isCollapsed) {
    const body = document.createElement("div");
    body.className = "priority-group-body";
    if (list.length === 0) body.innerHTML = `<div class="empty-note">Nothing here.</div>`;
    list.forEach(entry => body.appendChild(renderPriorityItem(entry, list, groupKey)));
    groupDiv.appendChild(body);
  }
  return groupDiv;
}

function renderPriorityItem(entry, list, groupKey) {
  const { kind, id, item, taskId } = entry;
  const task = kind === "subtask" ? tasks[taskId] : item;
  const project = task ? projects[task.projectId] : null;
  const status = deadlineStatus(item);
  const key = groupKey + "-" + kind + "-" + id;
  const isExpanded = expandedPriorityItems.has(key);

  const wrap = document.createElement("div");
  wrap.className = "priority-item";
  wrap.draggable = true;

  const header = document.createElement("div");
  header.className = "priority-item-header";
  header.innerHTML = `
    <span class="drag-handle" title="Drag to reorder" aria-hidden="true">&#8942;&#8942;</span>
    <span class="name">${escapeHtml(item.name)}</span>
    ${badgeHtml(status)}
    ${project ? `<span class="tag">${escapeHtml(project.name)}</span>` : ""}
  `;
  header.addEventListener("click", (e) => {
    if (e.target.closest(".drag-handle")) return;
    if (expandedPriorityItems.has(key)) expandedPriorityItems.delete(key); else expandedPriorityItems.add(key);
    render();
  });
  wrap.appendChild(header);
  if (isExpanded) wrap.appendChild(renderPriorityDetail(kind, id, item, taskId, task));

  wrap.addEventListener("dragstart", (e) => { dragState = { id, kind, groupKey }; wrap.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  wrap.addEventListener("dragend", () => { wrap.classList.remove("dragging"); dragState = null; });
  wrap.addEventListener("dragover", (e) => { e.preventDefault(); });
  wrap.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!dragState || dragState.groupKey !== groupKey) return;
    const fromIdx = list.findIndex(en => en.id === dragState.id && en.kind === dragState.kind);
    const toIdx = list.findIndex(en => en.id === id && en.kind === kind);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const reordered = list.slice();
    const [moved] = reordered.splice(fromIdx, 1);
    reordered.splice(toIdx, 0, moved);
    reordered.forEach((en, i) => db.ref("state/" + en.kind + "s/" + en.id + "/priorityOrder").set(i));
  });

  return wrap;
}

function escapeHtml(str) { const div = document.createElement("div"); div.textContent = str || ""; return div.innerHTML; }
function escapeAttr(str) { return (str || "").replace(/"/g, "&quot;"); }

document.getElementById("add-project-btn").addEventListener("click", addProject);
</script>
</body>
